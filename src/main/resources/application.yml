spring:
  datasource:
    url: jdbc:h2:mem:appdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  sql:
    init:
      mode: never

logging:
  level:
    org.hibernate.SQL: debug

jwt:
  secret: this-is-a-very-long-secret-for-dev-only-change-in-prod-1234567890
  access-token-validity-ms: 3600000 # 1h

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
